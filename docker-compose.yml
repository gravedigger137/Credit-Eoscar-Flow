services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_eoscar_flow}
      POSTGRES_USER: ${POSTGRES_USER:-credit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-5000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://0.0.0.0:${PORT:-5000}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-credit_app}:${POSTGRES_PASSWORD:-credit_app_password}@postgres:5432/${POSTGRES_DB:-credit_eoscar_flow}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      SENSITIVE_CONFIG_ENCRYPTION_KEY: ${SENSITIVE_CONFIG_ENCRYPTION_KEY:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      ALLOW_ARCHIVE_UPLOADS: ${ALLOW_ARCHIVE_UPLOADS:-false}
      MALWARE_SCAN_PROVIDER: ${MALWARE_SCAN_PROVIDER:-disabled}
      MALWARE_SCAN_COMMAND: ${MALWARE_SCAN_COMMAND:-}
      MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-30000}
      PRIVATE_UPLOAD_STORAGE: ${PRIVATE_UPLOAD_STORAGE:-local}
      SIGNED_DOWNLOAD_URLS_ENABLED: ${SIGNED_DOWNLOAD_URLS_ENABLED:-false}
      MFA_ENFORCE_ADMIN: ${MFA_ENFORCE_ADMIN:-false}
      MFA_ISSUER: ${MFA_ISSUER:-Credit-Eoscar}
      MFA_TOTP_WINDOW: ${MFA_TOTP_WINDOW:-1}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_PASSWORD_RESET_WINDOW_MS: ${RATE_LIMIT_PASSWORD_RESET_WINDOW_MS:-3600000}
      RATE_LIMIT_PASSWORD_RESET_MAX: ${RATE_LIMIT_PASSWORD_RESET_MAX:-5}
      RATE_LIMIT_API_WINDOW_MS: ${RATE_LIMIT_API_WINDOW_MS:-60000}
      RATE_LIMIT_API_MAX: ${RATE_LIMIT_API_MAX:-300}
      RATE_LIMIT_UPLOAD_WINDOW_MS: ${RATE_LIMIT_UPLOAD_WINDOW_MS:-60000}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-20}
      RATE_LIMIT_ADMIN_WINDOW_MS: ${RATE_LIMIT_ADMIN_WINDOW_MS:-60000}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-120}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      LOCAL_MODEL_ENDPOINT: ${LOCAL_MODEL_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      INSTITUTIONAL_EXCHANGE_WORKER_ENABLED: ${INSTITUTIONAL_EXCHANGE_WORKER_ENABLED:-false}
      INSTITUTIONAL_EXCHANGE_WORKER_INTERVAL_MS: ${INSTITUTIONAL_EXCHANGE_WORKER_INTERVAL_MS:-30000}
      INSTITUTIONAL_EXCHANGE_ALLOWED_ENDPOINTS: ${INSTITUTIONAL_EXCHANGE_ALLOWED_ENDPOINTS:-}
      INSTITUTIONAL_EXCHANGE_STRIPE_ENABLED: ${INSTITUTIONAL_EXCHANGE_STRIPE_ENABLED:-false}
      INSTITUTIONAL_EXCHANGE_STRIPE_ENDPOINT: ${INSTITUTIONAL_EXCHANGE_STRIPE_ENDPOINT:-}
      INSTITUTIONAL_EXCHANGE_STRIPE_CREDENTIAL_REF: ${INSTITUTIONAL_EXCHANGE_STRIPE_CREDENTIAL_REF:-}
      INSTITUTIONAL_EXCHANGE_DWOLLA_ENABLED: ${INSTITUTIONAL_EXCHANGE_DWOLLA_ENABLED:-false}
      INSTITUTIONAL_EXCHANGE_DWOLLA_ENDPOINT: ${INSTITUTIONAL_EXCHANGE_DWOLLA_ENDPOINT:-}
      INSTITUTIONAL_EXCHANGE_DWOLLA_CREDENTIAL_REF: ${INSTITUTIONAL_EXCHANGE_DWOLLA_CREDENTIAL_REF:-}
      INSTITUTIONAL_EXCHANGE_ACH_ENABLED: ${INSTITUTIONAL_EXCHANGE_ACH_ENABLED:-false}
      INSTITUTIONAL_EXCHANGE_ACH_ENDPOINT: ${INSTITUTIONAL_EXCHANGE_ACH_ENDPOINT:-}
      INSTITUTIONAL_EXCHANGE_ACH_CREDENTIAL_REF: ${INSTITUTIONAL_EXCHANGE_ACH_CREDENTIAL_REF:-}
      DWOLLA_KEY: ${DWOLLA_KEY:-}
      DWOLLA_SECRET: ${DWOLLA_SECRET:-}
      DWOLLA_ENV: ${DWOLLA_ENV:-sandbox}
      DWOLLA_API_URL: ${DWOLLA_API_URL:-}
      DWOLLA_PLAID_EXCHANGE_PARTNER_HREF: ${DWOLLA_PLAID_EXCHANGE_PARTNER_HREF:-}
      DWOLLA_WEBHOOK_SECRET: ${DWOLLA_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '5000') + '/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  uploads-data:
